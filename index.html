<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Budget Tracker</title>
    <script>
      // Apply theme before first paint to avoid a flash of the wrong theme
      (function () {
        var theme = localStorage.getItem("theme") || "system";
        var root = document.documentElement;
        if (theme === "girly-pink") {
          root.classList.add("theme-girly-pink");
        } else if (
          theme === "dark" ||
          (theme === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          root.classList.add("dark");
        }
      })();
    </script>
    <style>
      /* Boot splash: painted before the JS bundle parses, removed on React mount */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #fbfbfb;
        color: #737373;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        z-index: 9999;
      }
      html.dark #boot-splash {
        background: #0a0a0a;
        color: #a3a3a3;
      }
      html.theme-girly-pink #boot-splash {
        background: #fdf2f7;
        color: #a1567c;
      }
      #boot-splash .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        opacity: 0.6;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash">
      <img
        src="/logo.png"
        alt=""
        width="56"
        height="56"
        style="border-radius: 14px; display: block"
      />
      <div class="spinner"></div>
      <span>Budget Tracker</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
